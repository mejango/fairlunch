[profile.default]
src = "src"
test = "test"
solc = "0.8.28"
bytecode_hash = "none"
evm_version = "cancun"
optimizer = true
via_ir = true
optimizer_runs = 200
libs = ["node_modules", "lib"]
# Required by Sphinx proposal artifact collection.
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./cache" }
]

# Sphinx 0.33 uses the non-isolated script model.
[profile.deploy]
isolate = false

[profile.default.fuzz]
runs = 512

# As in Sticky: lints are triaged by hand, not on every build. The remaining unchecked casts are bounded by the
# ETH supply, by `MAX_GRANTED_PERCENT`, or by Uniswap's own tick and delta ranges.
[lint]
lint_on_build = false

[fmt]
number_underscore = "thousands"
multiline_func_header = "all"
wrap_comments = true

[rpc_endpoints]
ethereum = "${RPC_ETHEREUM_MAINNET}"
optimism = "${RPC_OPTIMISM_MAINNET}"
base = "${RPC_BASE_MAINNET}"
arbitrum = "${RPC_ARBITRUM_MAINNET}"
ethereum_sepolia = "${RPC_ETHEREUM_SEPOLIA}"
optimism_sepolia = "${RPC_OPTIMISM_SEPOLIA}"
base_sepolia = "${RPC_BASE_SEPOLIA}"
arbitrum_sepolia = "${RPC_ARBITRUM_SEPOLIA}"
